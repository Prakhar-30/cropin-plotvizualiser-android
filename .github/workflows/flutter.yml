name: flutter

# The package is verified here rather than on a laptop: every push is analysed,
# its tests run on the current Flutter and on the oldest one pubspec.yaml
# promises, and the example app - standing in for a host app - is built.
on:
  push:
    branches: [flutter, flutter_updated_flow]
  pull_request:
    branches: [flutter, flutter_updated_flow]
  workflow_dispatch:

# A newer push makes an in-flight run on the same branch worthless.
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'any' is the latest stable; 3.22.3 is the floor in pubspec.yaml, so a
        # host app on an older Flutter is not the first to find an API we use
        # that it does not have.
        flutter: ['any', '3.22.3']
    name: analyze-and-test (flutter ${{ matrix.flutter }})
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded

  # Compiles the plugin's Kotlin inside a host app - the example - along with
  # every dependency's native code, which `flutter analyze` cannot see. The
  # debug APK is kept as an artifact so a build can be side-loaded from the run.
  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    # To publish the field-build release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle and its dependencies are most of a cold APK build.
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: plot-finder-debug-apk
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      # The one to put on a phone: release mode, 64-bit ARM only (every
      # current Android phone), so roughly a sixth of the debug APK's size.
      # No simulation panel - that is debug-only. Signed with the debug key,
      # which installs fine for testing but is not a Play Store build.
      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: plot-finder-release-arm64-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      # A link anyone can open from a phone, no GitHub account and no zip:
      # every push to the field branch replaces plot-finder.apk on the
      # field-build release, so the address below never changes.
      #   https://github.com/Prakhar-30/cropin-plotvizualiser-android/releases/download/field-build/plot-finder.apk
      - name: Publish the field build
        if: github.event_name == 'push' && github.ref == 'refs/heads/flutter_updated_flow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk plot-finder.apk
          if ! gh release view field-build >/dev/null 2>&1; then
            gh release create field-build --prerelease --target "$GITHUB_SHA" \
              --title "Plot Finder - field build" --notes "Latest field build."
          fi
          gh release upload field-build plot-finder.apk --clobber
          gh release edit field-build --notes "Latest build of flutter_updated_flow, ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M') UTC. Install plot-finder.apk on the phone (allow installing from this source when Android asks)."
