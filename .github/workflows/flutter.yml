name: flutter

# The port is verified here rather than on a laptop: every push to the Flutter
# branch is analysed and its unit tests run, so a milestone that does not
# compile cannot pass silently.
on:
  push:
    branches: [flutter]
  pull_request:
    branches: [flutter]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test --reporter expanded

  # Compiles the Android host, the native channel in Kotlin and every plugin,
  # which `flutter analyze` cannot see. The debug APK is kept as an artifact so
  # a build can be side-loaded straight from the run.
  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: plot-finder-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
