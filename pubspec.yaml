name: plot_finder
description: >-
  AR plot boundary finder. Points the phone around, shows the target farm plot
  highlighted on the ground through the camera. Offline once cached, phone
  sensors only, no ARCore.
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# Deliberately short. Everything that decides where the overlay lands lives in
# lib/core and imports nothing but dart:math, so it runs under `flutter test`
# on any machine. The platform pieces Flutter plugins cannot give faithfully -
# the fused rotation vectors, the camera's physical sensor geometry, and a fix
# that says whether it carries a bearing at all - come from a small native
# channel in android/app/src/main/kotlin rather than from more packages.
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
