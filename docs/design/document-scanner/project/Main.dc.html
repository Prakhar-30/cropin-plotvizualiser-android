<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan document – capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9FD3B0}a:hover{color:#C6E9D1}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #26343A; font-family: Roboto, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column">

  <!-- App bar -->
  <header style="height: 56px; flex-shrink: 0; background: #234556; display: flex; align-items: center; gap: 4px; padding: 0 4px; position: relative; z-index: 2">
    <button aria-label="Close scanner" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border-radius: 24px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center">
      <div style="font-size: 18px; font-weight: 500; line-height: 22px">Scan document</div>
      <div style="font-size: 12px; color: #C3D2DA; line-height: 16px">Page 3 · Multi-page</div>
    </div>
    <button aria-label="Scanning tips" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border-radius: 24px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17h.01"/></svg>
    </button>
  </header>

  <!-- Camera feed area -->
  <div style="flex: 1; position: relative">
    <!-- Simulated paper in frame -->
    <div aria-hidden="true" style="position: absolute; left: 62px; top: 132px; width: 262px; height: 352px; background: #E8EAE3; border-radius: 3px; transform: rotate(-3deg); box-shadow: 0 10px 30px rgba(0,0,0,0.35); padding: 26px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="height: 10px; width: 55%; background: #B9BEB6; border-radius: 2px"></div>
      <div style="height: 6px; width: 35%; background: #CDD1C9; border-radius: 2px"></div>
      <div style="height: 1px; background: #CDD1C9; margin: 8px 0"></div>
      <div style="height: 6px; width: 92%; background: #CDD1C9; border-radius: 2px"></div>
      <div style="height: 6px; width: 86%; background: #CDD1C9; border-radius: 2px"></div>
      <div style="height: 6px; width: 90%; background: #CDD1C9; border-radius: 2px"></div>
      <div style="height: 6px; width: 70%; background: #CDD1C9; border-radius: 2px"></div>
      <div style="height: 40px"></div>
      <div style="height: 6px; width: 88%; background: #CDD1C9; border-radius: 2px"></div>
      <div style="height: 6px; width: 80%; background: #CDD1C9; border-radius: 2px"></div>
      <div style="height: 6px; width: 60%; background: #CDD1C9; border-radius: 2px"></div>
    </div>

    <!-- Detected edges -->
    <svg aria-hidden="true" width="390" height="560" viewBox="0 0 390 560" style="position: absolute; left: 0; top: 0">
      <polygon points="52,145 313,131 332,482 71,496" fill="rgba(47,125,69,0.16)" stroke="#4CC27A" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="52" cy="145" r="7" fill="#FFFFFF" stroke="#4CC27A" stroke-width="2.5"/>
      <circle cx="313" cy="131" r="7" fill="#FFFFFF" stroke="#4CC27A" stroke-width="2.5"/>
      <circle cx="332" cy="482" r="7" fill="#FFFFFF" stroke="#4CC27A" stroke-width="2.5"/>
      <circle cx="71" cy="496" r="7" fill="#FFFFFF" stroke="#4CC27A" stroke-width="2.5"/>
    </svg>

    <!-- Top overlay controls -->
    <div style="position: absolute; left: 0; right: 0; top: 0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: rgba(15,26,32,0.55)">
      <div style="display: flex; gap: 8px">
        <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #FFFFFF; color: #1A3542; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg>
          Auto capture
        </button>
        <button aria-label="Grid lines" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.35); background: rgba(15,26,32,0.6); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
        </button>
      </div>
      <button aria-label="Flash: auto" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.35); background: rgba(15,26,32,0.6); color: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
        Auto
      </button>
    </div>

    <!-- Detection status -->
    <div style="position: absolute; left: 0; right: 0; top: 508px; display: flex; justify-content: center">
      <div role="status" style="height: 36px; padding: 0 16px; border-radius: 18px; background: rgba(15,26,32,0.8); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #4CC27A"></span>
        Document found · hold steady
      </div>
    </div>
  </div>

  <!-- Bottom control panel -->
  <div style="flex-shrink: 0; background: #0F1A20; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <!-- Mode switch -->
    <div style="display: flex; justify-content: center">
      <div role="tablist" aria-label="Capture mode" style="display: flex; padding: 3px; border-radius: 20px; background: #1E2B32">
        <button role="tab" aria-selected="false" style="height: 32px; padding: 0 16px; border: 0; border-radius: 16px; background: transparent; color: #B7C3CA; font-size: 13px; font-weight: 500">Single page</button>
        <button role="tab" aria-selected="true" style="height: 32px; padding: 0 16px; border: 0; border-radius: 16px; background: #234556; color: #FFFFFF; font-size: 13px; font-weight: 500">Multi-page</button>
        <button role="tab" aria-selected="false" style="height: 32px; padding: 0 16px; border: 0; border-radius: 16px; background: transparent; color: #B7C3CA; font-size: 13px; font-weight: 500">ID card</button>
      </div>
    </div>

    <!-- Controls -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
        <button aria-label="Import from gallery or files" style="width: 52px; height: 52px; border-radius: 26px; border: 1px solid rgba(255,255,255,0.3); background: #1E2B32; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
        </button>
        <span style="font-size: 12px; color: #B7C3CA; padding-left: 8px">Import</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <button aria-label="Capture page" style="width: 76px; height: 76px; border-radius: 38px; border: 4px solid #FFFFFF; background: transparent; padding: 4px; display: flex; align-items: center; justify-content: center">
          <span style="width: 60px; height: 60px; border-radius: 30px; background: #FFFFFF; display: block"></span>
        </button>
        <span style="font-size: 12px; color: #B7C3CA">Auto in 1s</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
        <button aria-label="Done, 2 pages captured" style="position: relative; height: 52px; padding: 0 6px 0 6px; border-radius: 10px; border: 0; background: transparent; display: flex; align-items: center">
          <span aria-hidden="true" style="width: 40px; height: 52px; border-radius: 6px; background: #E8EAE3; border: 2px solid #FFFFFF; box-sizing: border-box; transform: rotate(-6deg); display: block"></span>
          <span aria-hidden="true" style="width: 40px; height: 52px; border-radius: 6px; background: #E8EAE3; border: 2px solid #FFFFFF; box-sizing: border-box; margin-left: -28px; display: block"></span>
          <span style="position: absolute; right: -2px; top: -8px; min-width: 22px; height: 22px; border-radius: 11px; background: #2F7D45; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #0F1A20">2</span>
        </button>
        <span style="font-size: 12px; color: #FFFFFF; font-weight: 500; padding-right: 4px">Review</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
