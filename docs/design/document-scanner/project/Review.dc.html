<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan document – review and enhance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#234556}a:hover{color:#1A3542}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F2F4F5; font-family: Roboto, system-ui, sans-serif; color: #1A2228; display: flex; flex-direction: column">

  <!-- App bar -->
  <header style="height: 56px; flex-shrink: 0; background: #234556; color: #FFFFFF; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px">
    <button aria-label="Back to camera" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border-radius: 24px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div style="flex: 1; display: flex; flex-direction: column">
      <div style="font-size: 18px; font-weight: 500; line-height: 22px">Review page</div>
      <div style="font-size: 12px; color: #C3D2DA; line-height: 16px">Page 3 of 3</div>
    </div>
    <button style="height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: #1A3542; color: #FFFFFF; font-size: 14px; font-weight: 500">Retake</button>
  </header>

  <!-- Editing stage -->
  <div style="flex: 1; background: #1A2228; position: relative; display: flex; align-items: center; justify-content: center">
    <div aria-label="Scanned page preview" role="img" style="position: relative; width: 258px; height: 350px; background: #FBFBF8; box-shadow: 0 6px 20px rgba(0,0,0,0.4); padding: 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px">
      <div style="height: 10px; width: 55%; background: #3A4248; border-radius: 2px"></div>
      <div style="height: 6px; width: 35%; background: #8A9399; border-radius: 2px"></div>
      <div style="height: 1px; background: #C9CED2; margin: 8px 0"></div>
      <div style="height: 6px; width: 92%; background: #8A9399; border-radius: 2px"></div>
      <div style="height: 6px; width: 86%; background: #8A9399; border-radius: 2px"></div>
      <div style="height: 6px; width: 90%; background: #8A9399; border-radius: 2px"></div>
      <div style="height: 6px; width: 70%; background: #8A9399; border-radius: 2px"></div>
      <div style="height: 36px"></div>
      <div style="height: 6px; width: 88%; background: #8A9399; border-radius: 2px"></div>
      <div style="height: 6px; width: 80%; background: #8A9399; border-radius: 2px"></div>
      <div style="height: 6px; width: 60%; background: #8A9399; border-radius: 2px"></div>

      <!-- Crop frame -->
      <div aria-hidden="true" style="position: absolute; inset: -6px; border: 2px solid #4CC27A; border-radius: 2px"></div>
      <span aria-hidden="true" style="position: absolute; left: -14px; top: -14px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; border: 3px solid #4CC27A"></span>
      <span aria-hidden="true" style="position: absolute; right: -14px; top: -14px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; border: 3px solid #4CC27A"></span>
      <span aria-hidden="true" style="position: absolute; left: -14px; bottom: -14px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; border: 3px solid #4CC27A"></span>
      <span aria-hidden="true" style="position: absolute; right: -14px; bottom: -14px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; border: 3px solid #4CC27A"></span>
      <span aria-hidden="true" style="position: absolute; left: 50%; top: -11px; margin-left: -16px; width: 32px; height: 8px; border-radius: 4px; background: #FFFFFF; border: 2px solid #4CC27A"></span>
      <span aria-hidden="true" style="position: absolute; left: 50%; bottom: -11px; margin-left: -16px; width: 32px; height: 8px; border-radius: 4px; background: #FFFFFF; border: 2px solid #4CC27A"></span>
    </div>

    <!-- Quality check -->
    <div role="status" style="position: absolute; left: 16px; right: 16px; top: 12px; height: 40px; border-radius: 20px; background: rgba(15,26,32,0.85); color: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4CC27A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
      <span style="font-weight: 500">Good quality</span>
      <span style="color: #B7C3CA">· Sharp, evenly lit, text readable</span>
    </div>
  </div>

  <!-- Tools sheet -->
  <div style="flex-shrink: 0; background: #FFFFFF; border-radius: 16px 16px 0 0; margin-top: -16px; position: relative; padding: 16px 16px 16px; display: flex; flex-direction: column; gap: 16px">
    <!-- Tools -->
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button style="height: 60px; border: 0; border-radius: 12px; background: #E3ECF0; color: #234556; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        Crop
      </button>
      <button style="height: 60px; border: 0; border-radius: 12px; background: transparent; color: #1A2228; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        Rotate
      </button>
      <button style="height: 60px; border: 0; border-radius: 12px; background: transparent; color: #1A2228; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Adjust
      </button>
      <button style="height: 60px; border: 0; border-radius: 12px; background: transparent; color: #C62828; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        Delete
      </button>
    </div>

    <!-- Filters -->
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 14px; font-weight: 500; color: #1A2228">Filter</div>
      <div style="display: flex; gap: 10px">
        <button aria-pressed="false" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #56636C">
          <span style="width: 62px; height: 62px; border-radius: 10px; background: #D8D4C6; border: 2px solid transparent; box-sizing: border-box; display: block"></span>Original
        </button>
        <button aria-pressed="true" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #234556; font-weight: 700">
          <span style="width: 62px; height: 62px; border-radius: 10px; background: #FBFBF8; border: 2px solid #234556; box-sizing: border-box; display: block; box-shadow: 0 0 0 2px #FFFFFF inset"></span>Auto
        </button>
        <button aria-pressed="false" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #56636C">
          <span style="width: 62px; height: 62px; border-radius: 10px; background: #D9D9D9; border: 2px solid transparent; box-sizing: border-box; display: block"></span>Grayscale
        </button>
        <button aria-pressed="false" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #56636C">
          <span style="width: 62px; height: 62px; border-radius: 10px; background: #FFFFFF; border: 2px solid #C5CDD2; box-sizing: border-box; display: block"></span>B &amp; W
        </button>
        <button aria-pressed="false" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #56636C">
          <span style="width: 62px; height: 62px; border-radius: 10px; background: #EFE7CF; border: 2px solid transparent; box-sizing: border-box; display: block"></span>Vivid
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 4px">
      <button style="height: 48px; border-radius: 8px; border: 1.5px solid #234556; background: #FFFFFF; color: #234556; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add page
      </button>
      <button style="height: 48px; border-radius: 8px; border: 0; background: #234556; color: #FFFFFF; font-size: 15px; font-weight: 500">Done · 3 pages</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
